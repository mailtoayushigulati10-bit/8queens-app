<!DOCTYPE html>
<html>
<head>
    <title>Instructions - 8 Queens</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="instructions-page">
    <div class="instructions-section">
        <h2>How to Play</h2>
        <p>Place 8 queens on the board so that no two queens attack each other.</p>
        <ul class="rules">
            <li>One queen per row.</li>
            <li>One queen per column.</li>
            <li>No two queens share the same diagonal.</li>
        </ul>
        <a href="{{ url_for('play') }}"><button class="play-btn">Play Now</button></a>
    </div>
</body>
</html>
