<!DOCTYPE html>
<html>
<head>
    <title>Play 8 Queens</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .show-step { opacity: 0; animation: fadeIn 0.8s forwards; }
        @keyframes fadeIn { to { opacity: 1; } }
        #solutionStepsContainer div { margin: 5px 0; }
    </style>
</head>
<body class="play-page">
<div class="play-container">
    <div class="game-area">

        <!-- Board Section -->
        <div class="board-section">
            <div class="top-bar">
                <span>Conflicts: <span id="conflicts">0</span></span>
                <span>Time: <span id="timer">0</span> sec</span>
            </div>
            <div id="board" class="board"></div>
            <div class="bottom-bar">
                <button onclick="resetBoard()">Reset</button>
                <a href="{{ url_for('home') }}"><button>Home</button></a>
            </div>
        </div>

        <!-- Side Button -->
        <div class="side-button">
            <button onclick="fetchSolution()">Optimal Solution</button>
            <div id="solutionStepsContainer"></div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
<script>
function fetchSolution() {
    fetch("/solve")
        .then(res => res.json())
        .then(data => showSolution(data.solution))
        .catch(err => console.error("Error fetching solution:", err));
}
</script>
</body>
</html>
